[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "groq-not-grok"
version = "0.2.0"
description = "Dependency-free Groq API client with browser-backed web search and vision"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Ninnix" },
]
keywords = [
    "groq", "openai-compatible", "llm", "web", "chrome", "cdp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
[project.scripts]
groq-not-grok = "groq_not_grok.main:main"

[project.urls]
Homepage = "https://github.com/Ninnix/groq-not-grok"
Repository = "https://github.com/Ninnix/groq-not-grok"

[tool.hatch.build.targets.wheel]
packages = ["src/groq_not_grok"]

[tool.hatch.build.targets.sdist]
include = [
    "src/groq_not_grok",
    "README.md",
    "pyproject.toml",
]
